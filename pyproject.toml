[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-toolkit"
version = "0.1.0"
description = "Agnostic, modular blog generation, content planning, and SEO/AEO publishing toolkit powered by Gemini AI."
readme = "README.md"
authors = [{ name = "Dali Rojas", email = "rojasdali@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
]

[project.scripts]
blog-toolkit = "blog_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
